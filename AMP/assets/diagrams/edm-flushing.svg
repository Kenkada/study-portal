<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" role="img" aria-labelledby="t d">
<title id="t">Dielectric flushing methods in EDM</title>
<desc id="d">Four panels: pressure flushing through the tool, suction through the workpiece, side or jet flushing, and periodic electrode retraction (pulsed flushing).</desc>
<style>
 .s{stroke:#222;stroke-width:1.5;fill:none}
 .f{stroke:#1d5a8c;stroke-width:2;fill:none}
 text{font-family:Inter,Arial,sans-serif;font-size:12.5px;fill:#222}
 .sm{font-size:11px;fill:#444}
 .b{font-weight:700}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d5a8c"/></marker></defs>
<rect width="560" height="420" fill="#fff"/>
<!-- a: pressure through tool -->
<text x="15" y="24" class="b">(a) Pressure through tool</text>
<rect x="105" y="40" width="60" height="100" fill="#e6c29b" class="s"/>
<rect x="130" y="40" width="10" height="100" fill="#fff" class="s"/>
<rect x="40" y="145" width="190" height="45" fill="#d8d3c6" class="s"/>
<line x1="135" y1="30" x2="135" y2="138" class="f" marker-end="url(#a)"/>
<path d="M130,143 Q110,143 100,120" class="f" marker-end="url(#a)"/><path d="M140,143 Q160,143 170,120" class="f" marker-end="url(#a)"/>
<text x="15" y="208" class="sm">Most effective for blind cavities;</text>
<text x="15" y="221" class="sm">rising debris causes side sparks → taper.</text>
<!-- b: suction through work -->
<text x="295" y="24" class="b">(b) Suction through workpiece</text>
<rect x="385" y="40" width="60" height="100" fill="#e6c29b" class="s"/>
<rect x="320" y="145" width="190" height="45" fill="#d8d3c6" class="s"/>
<rect x="409" y="145" width="12" height="45" fill="#fff" class="s"/>
<path d="M370,110 Q378,142 405,146" class="f" marker-end="url(#a)"/><path d="M460,110 Q452,142 425,146" class="f" marker-end="url(#a)"/>
<line x1="415" y1="150" x2="415" y2="200" class="f" marker-end="url(#a)"/>
<text x="295" y="216" class="sm">Clean fluid enters from the sides;</text>
<text x="295" y="229" class="sm">little taper → parallel walls, fine finish.</text>
<!-- c: side / jet -->
<text x="15" y="250" class="b">(c) Side (jet) flushing</text>
<rect x="105" y="266" width="60" height="90" fill="#e6c29b" class="s"/>
<rect x="40" y="360" width="190" height="40" fill="#d8d3c6" class="s"/>
<rect x="20" y="318" width="30" height="12" fill="#bbb" class="s"/>
<line x1="50" y1="324" x2="100" y2="352" class="f" marker-end="url(#a)"/>
<text x="175" y="300" class="sm">least effective;</text>
<text x="175" y="313" class="sm">use when no hole</text>
<text x="175" y="326" class="sm">can be drilled</text>
<!-- d: pulsed -->
<text x="295" y="250" class="b">(d) Pulsed / periodic retraction</text>
<rect x="385" y="266" width="60" height="70" fill="#e6c29b" class="s"/>
<line style="stroke:#222" x1="470" y1="330" x2="470" y2="280" class="s" marker-end="url(#a)"/>
<line style="stroke:#222" x1="485" y1="280" x2="485" y2="330" class="s" marker-end="url(#a)"/>
<rect x="320" y="360" width="190" height="40" fill="#d8d3c6" class="s"/>
<path d="M360,350 Q380,342 390,350" class="f" marker-end="url(#a)"/>
<text x="295" y="414" class="sm">Electrode lifts, pumping fresh fluid in; reduces wear.</text>
</svg>
