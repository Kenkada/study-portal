<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 440" role="img" aria-labelledby="t d">
<title id="t">Wire EDM setup</title>
<desc id="d">A thin wire runs from a supply spool through tensioning rollers and an upper diamond or sapphire guide, through the workpiece, out through a lower guide to a take-up spool. Deionised water is jetted coaxially from upper and lower nozzles. The power supply connects to the wire (negative) and the workpiece (positive). The workpiece sits on a CNC X-Y table; U-V axes tilt the upper guide for taper. An inset shows the kerf in plan view.</desc>
<style>
 .s{stroke:#222;stroke-width:1.6;fill:none}
 .thin{stroke:#222;stroke-width:1.1;fill:none}
 .w{stroke:#b07d2b;stroke-width:2.4;fill:none}
 .f{stroke:#1d5a8c;stroke-width:1.8;fill:none}
 text{font-family:Inter,Arial,sans-serif;font-size:12.5px;fill:#222}
 .sm{font-size:11px;fill:#444}
 .b{font-weight:700}
</style>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker>
<marker id="fa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d5a8c"/></marker></defs>
<rect width="680" height="440" fill="#fff"/>
<!-- supply spool -->
<circle cx="80" cy="70" r="34" class="s" fill="#f3e3c4"/><circle cx="80" cy="70" r="8" class="s"/>
<text x="40" y="124" class="b">Supply spool</text>
<!-- tension rollers -->
<circle cx="170" cy="40" r="10" class="s"/><circle cx="200" cy="62" r="10" class="s"/>
<text x="150" y="20" class="sm">tension / brake rollers</text>
<path d="M80,36 L170,30 M178,48 L193,55 M210,62 L300,62 L300,150" class="w"/>
<!-- upper head -->
<rect x="270" y="110" width="60" height="38" class="s" fill="#eee"/>
<text x="338" y="122" class="sm">upper guide</text>
<text x="338" y="135" class="sm">(diamond / sapphire)</text>
<text x="338" y="148" class="sm">+ U–V taper axes</text>
<path d="M276,150 L300,166 L324,150" class="f"/>
<line x1="250" y1="130" x2="270" y2="130" class="f" marker-end="url(#fa)"/>
<text x="188" y="121" class="sm">DI water jet</text>
<!-- workpiece -->
<rect x="210" y="170" width="180" height="90" class="s" fill="#d8d3c6"/>
<text x="308" y="190" class="b">Workpiece (+)</text>
<text x="308" y="205" class="sm">up to ~300 mm thick</text>
<line x1="300" y1="150" x2="300" y2="282" class="w"/>
<text x="216" y="232" class="sm">wire (−)</text>
<text x="216" y="246" class="sm">Ø 0.05–0.3 mm</text>
<!-- lower head -->
<path d="M276,280 L300,264 L324,280" class="f"/>
<rect x="270" y="282" width="60" height="38" class="s" fill="#eee"/>
<text x="338" y="300" class="sm">lower guide + nozzle</text>
<!-- table -->
<rect x="150" y="330" width="300" height="20" class="s" fill="#ddd"/>
<text x="160" y="345" class="sm">CNC X–Y table</text><text x="310" y="345" class="sm">(adaptive gap control)</text>
<!-- take-up -->
<path d="M300,320 L300,390 L520,390 L520,330" class="w"/>
<circle cx="520" cy="300" r="34" class="s" fill="#f3e3c4"/><circle cx="520" cy="300" r="8" class="s"/>
<text x="470" y="356" class="b">Take-up spool</text>
<text x="470" y="370" class="sm">used wire discarded</text>
<!-- power -->
<rect x="20" y="210" width="120" height="66" rx="4" class="s" fill="#f1f1f1"/>
<text x="80" y="236" text-anchor="middle" class="b">Pulse</text>
<text x="80" y="252" text-anchor="middle" class="b">generator</text>
<text x="80" y="268" text-anchor="middle" class="sm">high freq, ≤ ~20–30 A</text>
<polyline points="140,222 180,222 180,95 300,95" class="s"/>
<circle cx="300" cy="95" r="3.5" fill="#222"/>
<text x="186" y="88" class="sm">− contact on wire</text>
<polyline points="140,262 210,262" class="s"/>
<text x="144" y="282" class="sm">+</text><text x="144" y="218" class="sm">−</text>
<!-- inset plan view -->
<rect style="stroke:#bbb" x="470" y="40" width="190" height="180" rx="6" class="s"/>
<text x="480" y="60" class="b">Plan view (kerf)</text>
<path style="stroke:#bbb;stroke-width:12" d="M500,190 L500,110 Q500,90 520,90 L630,90" class="s"/>
<path style="stroke-dasharray:4 3" d="M500,190 L500,110 Q500,90 520,90 L630,90" class="thin"/>
<circle cx="630" cy="90" r="3" fill="#b07d2b"/>
<text x="514" y="130" class="sm">wire path (CNC)</text>
<text x="514" y="150" class="sm">kerf = d + 2 × overcut</text>
<text x="514" y="170" class="sm">corner radius ≥ kerf/2</text>
</svg>
