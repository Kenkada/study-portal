<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 430" role="img" aria-labelledby="t d">
<title id="t">Die-sinking EDM setup</title>
<desc id="d">Pulsed DC generator connected to a servo-fed tool electrode (negative) and a workpiece (positive) submerged in dielectric, with pump and filter recirculation and gap-voltage feedback to the servo.</desc>
<style>
 .s{stroke:#222;stroke-width:1.6;fill:none}
 .thin{stroke:#222;stroke-width:1.1;fill:none}
 .dash{stroke:#555;stroke-width:1.3;fill:none;stroke-dasharray:5 4}
 text{font-family:Inter,Arial,sans-serif;font-size:13px;fill:#222}
 .sm{font-size:11.5px;fill:#444}
 .b{font-weight:700}
</style>
<defs>
 <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker>
 <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#888" stroke-width="1.2"/></pattern>
</defs>
<rect width="680" height="430" fill="#fff"/>
<!-- ram / servo -->
<rect x="355" y="40" width="120" height="58" rx="4" class="s" fill="#f1f1f1"/>
<text x="415" y="64" text-anchor="middle" class="b">Servo-fed ram</text>
<text x="415" y="82" text-anchor="middle" class="sm">keeps gap constant</text>
<line x1="500" y1="60" x2="500" y2="120" class="s" marker-end="url(#ar)"/>
<text x="508" y="96" class="sm">feed</text>
<!-- tool -->
<rect x="385" y="98" width="60" height="172" class="s" fill="#e6c29b"/>
<text x="452" y="150" class="b">Tool</text>
<text x="452" y="166" class="sm">electrode (−)</text>
<text x="452" y="182" class="sm">Cu / graphite</text>
<!-- tank and fluid -->
<path d="M250,200 L250,385 L590,385 L590,200" class="s"/>
<rect x="251.5" y="236" width="337" height="147.5" fill="#dcecf7"/>
<line style="stroke-dasharray:7 4" x1="251" y1="236" x2="589" y2="236" class="thin"/>
<rect x="385" y="236" width="60" height="34" fill="#e6c29b"/>
<line x1="385" y1="236" x2="385" y2="270" class="s"/><line x1="445" y1="236" x2="445" y2="270" class="s"/><line x1="385" y1="270" x2="445" y2="270" class="s"/>
<!-- table -->
<rect x="282" y="345" width="276" height="22" fill="url(#hatch)" class="s"/>
<text x="290" y="360" class="sm">insulated table</text>
<!-- workpiece -->
<rect x="330" y="282" width="170" height="63" class="s" fill="#d8d3c6"/>
<text x="415" y="320" text-anchor="middle" class="b">Workpiece (+)</text>
<text x="415" y="336" text-anchor="middle" class="sm">any conductor, any hardness</text>
<!-- spark -->
<polyline points="402,270 409,275 401,278 410,282" stroke="#c0392b" stroke-width="2" fill="none"/>
<polyline points="428,270 434,274 427,277 435,282" stroke="#c0392b" stroke-width="2" fill="none"/>
<line x1="438" y1="279" x2="462" y2="262" class="thin"/>
<text x="465" y="252" class="sm">spark gap (IEG)</text>
<text x="465" y="265" class="sm">≈ 10–50 µm</text>
<text x="262" y="258" class="sm">dielectric: kerosene /</text>
<text x="262" y="272" class="sm">EDM oil / DI water</text>
<!-- generator -->
<rect x="30" y="150" width="150" height="86" rx="4" class="s" fill="#f1f1f1"/>
<text x="105" y="178" text-anchor="middle" class="b">Pulsed DC</text>
<text x="105" y="196" text-anchor="middle" class="b">generator</text>
<text x="105" y="216" text-anchor="middle" class="sm">V, I, t<tspan font-size="9" dy="3">on</tspan><tspan dy="-3">, t</tspan><tspan font-size="9" dy="3">off</tspan><tspan dy="-3"> set here</tspan></text>
<text x="187" y="170" class="b">−</text>
<text x="187" y="230" class="b">+</text>
<polyline points="180,172 360,172 360,130 385,130" class="s"/>
<polyline points="180,226 225,226 225,310 330,310" class="s"/>
<!-- feedback -->
<polyline points="105,150 105,70 355,70" class="dash" marker-end="url(#ar)"/>
<text x="120" y="62" class="sm">gap-voltage signal → servo</text>
<!-- pump & filter -->
<polyline points="590,372 640,372 640,160 560,160 560,276 450,276" class="s" marker-end="url(#ar)"/>
<rect x="622" y="290" width="36" height="34" class="s" fill="#fff"/>
<text x="640" y="311" text-anchor="middle" class="sm">filter</text>
<circle cx="640" cy="225" r="17" class="s" fill="#fff"/>
<text x="640" y="229" text-anchor="middle" class="sm">pump</text>
<text x="566" y="152" class="sm">flushing</text>
<text x="300" y="410" class="sm">Debris-laden dielectric is filtered (≈ 2–5 µm) and pumped back to the gap.</text>
</svg>
