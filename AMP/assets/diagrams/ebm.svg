<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 520" role="img" aria-labelledby="t d">
<title id="t">Electron beam machining system</title>
<desc id="d">Electron gun at top: heated tungsten filament cathode, negatively biased grid cup that pulses the beam, and anode at up to 150 kV. Below: aperture, magnetic focusing lens and deflection coils, optical viewing port, then the vacuum work chamber with the workpiece and backing material on a CNC table, connected to vacuum pumps.</desc>
<style>
 .s{stroke:#222;stroke-width:1.6;fill:none}
 .thin{stroke:#222;stroke-width:1.1;fill:none}
 .e{stroke:#1d5a8c;stroke-width:2.2;fill:none}
 text{font-family:Inter,Arial,sans-serif;font-size:12.5px;fill:#222}
 .sm{font-size:11px;fill:#444}
 .b{font-weight:700}
</style>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs>
<rect width="640" height="520" fill="#fff"/>
<!-- column -->
<path d="M230,20 L370,20 L370,300 L230,300 Z" class="s" fill="#f7f7f7"/>
<!-- filament -->
<path style="stroke:#c0392b;stroke-width:2.4" d="M290,40 L300,60 L310,40" class="s"/>
<text x="380" y="46" class="b">Cathode</text>
<text x="380" y="60" class="sm">W / Ta filament ≈ 2000 °C (thermionic)</text>
<line x1="376" y1="50" x2="314" y2="48" class="thin"/>
<!-- grid cup -->
<path style="stroke-width:2.4" d="M262,52 L262,80 L290,80 M310,80 L338,80 L338,52" class="s"/>
<text x="380" y="86" class="b">Grid cup (bias)</text>
<text x="380" y="100" class="sm">negative bias → switches beam into pulses</text>
<line x1="376" y1="88" x2="340" y2="80" class="thin"/>
<!-- anode -->
<line x1="245" y1="120" x2="290" y2="120" stroke="#222" stroke-width="5"/><line x1="310" y1="120" x2="355" y2="120" stroke="#222" stroke-width="5"/>
<text x="380" y="124" class="b">Anode</text>
<text x="380" y="138" class="sm">50–150 kV accelerating voltage</text>
<line x1="376" y1="122" x2="356" y2="120" class="thin"/>
<!-- beam -->
<path d="M300,60 L300,410" class="e"/>
<!-- aperture -->
<line x1="245" y1="160" x2="294" y2="160" stroke="#222" stroke-width="3"/><line x1="306" y1="160" x2="355" y2="160" stroke="#222" stroke-width="3"/>
<text x="380" y="164" class="sm">aperture: strips stray electrons</text>
<!-- magnetic lens -->
<rect x="240" y="185" width="34" height="34" class="s" fill="#e2e2e2"/><rect x="326" y="185" width="34" height="34" class="s" fill="#e2e2e2"/>
<text x="380" y="198" class="b">Magnetic lens</text>
<text x="380" y="212" class="sm">lens current sets focus / spot size</text>
<!-- deflection -->
<rect x="250" y="240" width="22" height="30" class="s" fill="#ededed"/><rect x="328" y="240" width="22" height="30" class="s" fill="#ededed"/>
<text x="380" y="252" class="b">Deflection coils</text>
<text x="380" y="266" class="sm">sweep beam to cut shapes (≲ 6 mm field)</text>
<!-- viewing -->
<rect x="200" y="276" width="30" height="18" class="s" fill="#dff1ff"/>
<text x="40" y="290" class="sm">optical viewing port</text>
<line x1="150" y1="286" x2="198" y2="286" class="thin"/>
<!-- chamber -->
<rect x="130" y="300" width="340" height="170" class="s" fill="#fbfbfb"/>
<text x="140" y="320" class="b">Vacuum chamber</text><text x="140" y="336" class="sm">10⁻⁴–10⁻⁵ torr</text>
<rect x="210" y="410" width="180" height="22" class="s" fill="#d8d3c6"/>
<rect x="210" y="432" width="180" height="14" class="s" fill="#f0e2b6"/>
<text x="396" y="425" class="sm">workpiece</text>
<text x="396" y="443" class="sm">backing material</text>
<rect x="190" y="446" width="220" height="14" class="s" fill="#ccc"/>
<text x="196" y="484" class="sm">CNC work table</text>
<line x1="470" y1="400" x2="540" y2="400" class="s" marker-end="url(#ar)"/>
<text x="500" y="392" class="sm">to vacuum</text>
<text x="500" y="418" class="sm">pumps</text>
<!-- HV supply -->
<rect x="20" y="60" width="150" height="56" rx="4" class="s" fill="#f1f1f1"/>
<text x="95" y="84" text-anchor="middle" class="b">HV DC supply</text>
<text x="95" y="102" text-anchor="middle" class="sm">up to 150 kV</text>
<polyline points="170,74 290,40" class="thin"/>
<polyline points="170,104 245,120" class="thin"/>
<text x="20" y="150" class="sm">Whole column + chamber under vacuum:</text>
<text x="20" y="164" class="sm">no air scattering, no filament oxidation.</text>
<text x="20" y="196" class="sm">Electrons reach ≈ 0.5–0.8 c;</text>
<text x="20" y="210" class="sm">KE → heat at the impact spot.</text>
<text x="20" y="242" class="sm">X-rays produced → lead shielding.</text>
</svg>
